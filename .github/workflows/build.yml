name: Build & Package Windows Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Rust Runtime Engine (Static CRT MSVC)
  # -------------------------------------------------------------
  build-rust:
    name: Build Rust Engine
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Run Engine Tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Build Standalone Release Binary
        run: cargo build --release --manifest-path engine/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Upload Engine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifact
          path: engine/target/x86_64-pc-windows-msvc/release/engine.exe
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 2: Build Python Studio (uv + PyInstaller)
  # -------------------------------------------------------------
  build-python:
    name: Build Python Studio
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: 'latest'

      - name: Install Studio Dependencies with uv
        working-directory: studio
        run: uv sync

      - name: Package Studio into Standalone EXE with PyInstaller
        working-directory: studio
        run: |
          uv run pyinstaller --onefile --clean --name studio --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module tkinter --exclude-module unittest --exclude-module test --exclude-module pydoc --exclude-module email --exclude-module xmlrpc --exclude-module multiprocessing --exclude-module sqlite3 --exclude-module curses --exclude-module lib2to3 --exclude-module distutils main.py

      - name: Upload Studio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-artifact
          path: studio/dist/studio.exe
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 3: Bundle Release Package and Publish
  # -------------------------------------------------------------
  package-release:
    name: Package Release ZIP
    needs: [build-rust, build-python]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Engine Artifact
        uses: actions/download-artifact@v4
        with:
          name: engine-artifact
          path: bundle/

      - name: Download Studio Artifact
        uses: actions/download-artifact@v4
        with:
          name: studio-artifact
          path: bundle/

      - name: Assemble Release Bundle Directory
        shell: pwsh
        run: |
          Copy-Item "README.md" -Destination "bundle/"
          Copy-Item "start.bat" -Destination "bundle/"
          if (Test-Path "data/未命名.jpg") {
            New-Item -ItemType Directory -Path "bundle/data" -Force | Out-Null
            Copy-Item "data/未命名.jpg" -Destination "bundle/data/"
          }
          Get-ChildItem -Path "bundle" -Recurse

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "bundle/*" -DestinationPath "LianLianKan-Solver-windows-x64.zip" -Force
          Get-Item "LianLianKan-Solver-windows-x64.zip" | Select-Object Name, Length

      - name: Upload Final ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LianLianKan-Solver-windows-x64
          path: LianLianKan-Solver-windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LianLianKan-Solver-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
