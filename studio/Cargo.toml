[package]
name = "studio"
version = "0.1.0"
edition = "2021"
description = "LianLianKan Studio: board calibration, tile classification, profile export and editable preview"

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
minifb = "0.29.0"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
