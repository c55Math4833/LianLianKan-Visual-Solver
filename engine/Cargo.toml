[package]
name = "engine"
version = "0.1.0"
edition = "2021"
authors = ["Rust Engine Developer"]
description = "High-performance visual solver runtime for LianLianKan (連連看)"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[[bin]]
name = "engine"
path = "src/main.rs"

[lib]
name = "engine"
path = "src/lib.rs"
